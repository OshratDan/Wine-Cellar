<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מלאי יין">
<meta name="theme-color" content="#5c1a2b">
<title>מלאי היין שלי</title>
<style>
  :root{
    --wine:#5c1a2b;
    --wine-dark:#3d0f1c;
    --gold:#c9a227;
    --cream:#faf6ef;
    --card:#ffffff;
    --text:#2b1b17;
    --muted:#8a7b74;
    --border:#e8ddd1;
    --red:#8a2b3d;
    --white-wine:#d8b34a;
    --rose:#e0879b;
    --sparkling:#8fb9c9;
    --danger:#c0392b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--cream); color:var(--text);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{display:flex; flex-direction:column; min-height:100vh;}
  header.top{
    background:linear-gradient(135deg,var(--wine),var(--wine-dark));
    color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  header.top h1{margin:0 0 10px; font-size:20px; display:flex; align-items:center; gap:8px;}
  .search-row{display:flex; gap:8px;}
  .search-row input{
    flex:1; border:none; border-radius:12px; padding:10px 12px; font-size:15px;
    background:rgba(255,255,255,.92); color:var(--text);
  }
  .icon-btn{
    background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:12px;
    width:40px; height:40px; font-size:18px; display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 16px 0; -webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,.15);
    color:#fff; font-size:13px; border:1px solid rgba(255,255,255,.3);
  }
  .chip.active{background:#fff; color:var(--wine-dark); font-weight:600; border-color:#fff;}

  main{flex:1; padding:14px 16px 90px; overflow-y:auto;}
  .hidden{display:none !important;}

  .sort-bar{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .sort-bar select{
    flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:13px;
  }
  .sort-bar button{
    flex:none; width:40px; height:36px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:16px;
  }

  .empty-state{
    text-align:center; margin-top:60px; color:var(--muted);
  }
  .empty-state .big{font-size:44px; margin-bottom:10px;}
  .empty-state button{margin-top:16px;}

  .summary-bar{
    display:flex; gap:10px; margin-bottom:14px;
  }
  .summary-card{
    flex:1; background:var(--card); border-radius:14px; padding:10px 12px;
    text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.06);
  }
  .summary-card .num{font-size:20px; font-weight:700; color:var(--wine);}
  .summary-card .lbl{font-size:11px; color:var(--muted);}

  .card{
    background:var(--card); border-radius:16px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 5px rgba(0,0,0,.07); position:relative;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:16px; font-weight:700; margin:0;}
  .card-sub{font-size:13px; color:var(--muted); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff; white-space:nowrap;
  }
  .badge.red{background:var(--red);}
  .badge.white{background:var(--white-wine); color:#3d3115;}
  .badge.rose{background:var(--rose); color:#5b1220;}
  .badge.sparkling{background:var(--sparkling); color:#123344;}
  .badge.other{background:var(--muted);}

  .card-meta{
    display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:12.5px; color:#5a4a44;
  }
  .card-meta span b{color:var(--text);}
  .card-actions{display:flex; gap:8px; margin-top:10px;}
  .card-actions button{
    flex:1; border:1px solid var(--border); background:#fff9f2; border-radius:10px; padding:7px; font-size:13px;
  }
  .card-actions .qty-btn{flex:none; width:36px; font-weight:700; font-size:16px;}
  .low-stock{
    position:absolute; top:12px; left:14px; background:var(--danger); color:#fff; font-size:10.5px;
    padding:2px 8px; border-radius:999px;
  }

  .fab{
    position:fixed; left:20px; bottom:calc(78px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; background:var(--gold); color:#3d2e00;
    font-size:28px; border:none; box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:25;
  }

  nav.tabbar{
    position:fixed; bottom:0; right:0; left:0; background:#fff; border-top:1px solid var(--border);
    display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:10px 0 8px; font-size:11px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav.tabbar button .ic{font-size:20px;}
  nav.tabbar button.active{color:var(--wine); font-weight:700;}

  .section-title{font-size:14px; font-weight:700; color:var(--wine-dark); margin:16px 0 8px;}
  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px;}
  .bar-row .lbl{width:78px; flex:none; color:var(--muted); text-align:left;}
  .bar-track{flex:1; background:#f0e6d8; border-radius:6px; height:14px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--wine); border-radius:6px;}
  .bar-row .val{width:34px; flex:none; text-align:right; font-weight:600;}

  .loc-group{background:var(--card); border-radius:14px; padding:10px 14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .loc-group h4{margin:0 0 6px; font-size:14px; color:var(--wine);}
  .loc-item{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-top:1px dashed var(--border);}
  .loc-item:first-of-type{border-top:none;}

  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end;
  }
  .modal .sheet{
    background:#fff; width:100%; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
  }
  .modal h2{margin:0 0 14px; font-size:18px; color:var(--wine-dark);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:10px; font-size:15px; background:#fdfbf8;
  }
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; padding:11px; border-radius:12px; border:none; font-size:15px; font-weight:600;
  }
  .btn.primary{background:var(--wine); color:#fff;}
  .btn.secondary{background:#f0e6d8; color:var(--wine-dark);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn.full{width:100%;}

  .menu-list{padding:0;}
  .menu-list button{
    width:100%; text-align:right; padding:13px 6px; border:none; background:none; font-size:15.5px;
    border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
  }
  .menu-list button:last-child{border-bottom:none;}

  .import-map-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .import-map-row .lbl{width:100px; flex:none; font-size:13px; font-weight:600;}
  .import-map-row select{flex:1;}
  .import-mode{display:flex; gap:10px; margin:14px 0;}
  .import-mode label{
    flex:1; border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; font-size:13px;
  }
  .toast{
    position:fixed; bottom:100px; right:50%; transform:translateX(50%); background:#2b1b17; color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13.5px; z-index:60; opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  small.hint{color:var(--muted); display:block; margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>🍷 מלאי היין שלי</h1>
    <div class="search-row">
      <input id="search" type="search" placeholder="חיפוש: שם, יקב, אזור, ענב...">
      <button class="icon-btn" id="menu-btn">☰</button>
    </div>
    <div class="chips" id="type-chips"></div>
    <div class="chips" id="country-chips"></div>
  </header>

  <main id="view-inventory">
    <div class="summary-bar" id="summary-bar"></div>
    <div class="sort-bar">
      <select id="sort-field">
        <option value="name">מיון: שם היין</option>
        <option value="winery">מיון: יקב</option>
        <option value="type" selected>מיון: סוג</option>
        <option value="country">מיון: מדינה</option>
        <option value="region">מיון: אזור גידול</option>
        <option value="grape">מיון: ענב</option>
        <option value="vintage">מיון: שנה</option>
        <option value="bottleSize">מיון: גודל הבקבוק</option>
        <option value="cabinet">מיון: ארון</option>
        <option value="shelf">מיון: מדף</option>
        <option value="quantity">מיון: כמות</option>
        <option value="rating">מיון: ציון</option>
      </select>
      <button id="sort-dir" title="הפוך כיוון מיון">↑</button>
    </div>
    <div id="list-container"></div>
    <div class="empty-state hidden" id="empty-state">
      <div class="big">🍾</div>
      <div>עדיין אין בקבוקים במלאי</div>
      <button class="btn primary" onclick="document.getElementById('file-input').click()">ייבוא מקובץ אקסל</button>
    </div>
  </main>

  <main id="view-insights" class="hidden">
    <div id="insights-content"></div>
  </main>

  <main id="view-locations" class="hidden">
    <div id="locations-content"></div>
  </main>

  <button class="fab" id="add-btn">+</button>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="inventory"><span class="ic">🍷</span>מלאי</button>
    <button class="tab-btn" data-view="insights"><span class="ic">📊</span>תובנות</button>
    <button class="tab-btn" data-view="locations"><span class="ic">🗄️</span>מיקומים</button>
  </nav>
</div>

<!-- Add/Edit modal -->
<div class="modal hidden" id="modal-form">
  <div class="sheet">
    <h2 id="form-title">בקבוק חדש</h2>
    <div class="field"><label>שם היין</label><input id="f-name"></div>
    <div class="row2">
      <div class="field"><label>יקב</label><input id="f-winery"></div>
      <div class="field"><label>שנה</label><input id="f-vintage" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div class="field"><label>סוג</label>
        <select id="f-type">
          <option value="אדום">אדום</option>
          <option value="לבן">לבן</option>
          <option value="רוזה">רוזה</option>
          <option value="מבעבע">מבעבע</option>
          <option value="אחר">אחר</option>
        </select>
      </div>
      <div class="field"><label>מדינה</label><input id="f-country"></div>
    </div>
    <div class="row2">
      <div class="field"><label>אזור גידול</label><input id="f-region"></div>
      <div class="field"><label>ענב</label><input id="f-grape"></div>
    </div>
    <div class="row2">
      <div class="field"><label>גודל הבקבוק</label><input id="f-bottleSize" placeholder="750 מ״ל"></div>
      <div class="field"><label>ציון</label><input id="f-rating" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div class="field"><label>ארון</label><input id="f-cabinet"></div>
      <div class="field"><label>מדף</label><input id="f-shelf"></div>
    </div>
    <div class="field"><label>כמות</label><input id="f-quantity" inputmode="numeric" value="1"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="form-cancel">ביטול</button>
      <button class="btn primary" id="form-save">שמירה</button>
    </div>
  </div>
</div>

<!-- Menu modal -->
<div class="modal hidden" id="modal-menu">
  <div class="sheet">
    <h2>אפשרויות</h2>
    <div class="menu-list">
      <button id="menu-import">ייבוא מאקסל <span>📥</span></button>
      <button id="menu-export">ייצוא לאקסל <span>📤</span></button>
      <button id="menu-reset">איפוס כל הנתונים <span>🗑️</span></button>
      <button id="menu-close">סגירה</button>
    </div>
  </div>
</div>

<!-- Import mapping modal -->
<div class="modal hidden" id="modal-import">
  <div class="sheet">
    <h2>התאמת עמודות לייבוא</h2>
    <small class="hint">בדוק/עדכן איזו עמודה בקובץ מתאימה לכל שדה</small>
    <div id="import-map-list" style="margin-top:12px;"></div>
    <div class="import-mode">
      <label><input type="radio" name="imode" value="merge"> הוספה למלאי הקיים</label>
      <label><input type="radio" name="imode" value="replace" checked> החלפת כל המלאי</label>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" id="import-cancel">ביטול</button>
      <button class="btn primary" id="import-confirm">ייבוא</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".xlsx,.xls" class="hidden">
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<script>
(function(){
  "use strict";

  var FIELDS = [
    {key:"name", label:"שם היין", aliases:["שם היין","שם"]},
    {key:"winery", label:"יקב", aliases:["יקב"]},
    {key:"type", label:"סוג", aliases:["סוג"]},
    {key:"country", label:"מדינה", aliases:["מדינה"]},
    {key:"region", label:"אזור גידול", aliases:["אזור גידול","אזור"]},
    {key:"grape", label:"ענב", aliases:["ענב"]},
    {key:"vintage", label:"שנה", aliases:["שנה","וינטג'","וינטג"]},
    {key:"bottleSize", label:"גודל הבקבוק", aliases:["גודל הבקבוק","גודל"]},
    {key:"cabinet", label:"ארון", aliases:["ארון"]},
    {key:"shelf", label:"מדף", aliases:["מדף"]},
    {key:"quantity", label:"כמות", aliases:["כמות"]},
    {key:"rating", label:"ציון", aliases:["ציון"]}
  ];

  var STORAGE_KEY = "wineInventoryData_v1";
  var FIREBASE_URL = "https://wine-cellar-23e4d-default-rtdb.firebaseio.com/wines";
  var wines = [];
  var currentView = "inventory";
  var currentTypeFilter = "הכל";
  var currentCountryFilter = "הכל";
  var editingId = null;
  var pendingImportRows = null;
  var pendingImportHeaders = null;
  var currentSort = {field:"type", dir:"asc"};
  var NUMERIC_SORT_FIELDS = {vintage:1, quantity:1, rating:1};

  function cmpField(av, bv, isNumeric){
    if (isNumeric) return num(av) - num(bv);
    return String(av||"").localeCompare(String(bv||""), "he");
  }

  function sortWines(list){
    var f = currentSort.field;
    var dir = currentSort.dir === "asc" ? 1 : -1;
    list.sort(function(a,b){
      var cmp;
      if (f === "type"){
        // סוג / מדינה / שם יקב / שנה
        cmp = cmpField(a.type, b.type, false);
        if (cmp === 0) cmp = cmpField(a.country, b.country, false);
        if (cmp === 0) cmp = cmpField(a.winery, b.winery, false);
        if (cmp === 0) cmp = cmpField(a.vintage, b.vintage, true);
      } else {
        cmp = cmpField(a[f], b[f], !!NUMERIC_SORT_FIELDS[f]);
      }
      return cmp * dir;
    });
    return list;
  }

  function uid(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function loadWines(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveWines(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(wines));
  }

  // ---- cloud sync (Firebase Realtime Database) ----
  function cloudPutWine(wine){
    fetch(FIREBASE_URL + "/" + encodeURIComponent(wine.id) + ".json", {
      method: "PUT",
      body: JSON.stringify(wine)
    }).catch(function(){ /* offline - local copy stays authoritative until reconnect */ });
  }
  function cloudDeleteWine(id){
    fetch(FIREBASE_URL + "/" + encodeURIComponent(id) + ".json", {
      method: "DELETE"
    }).catch(function(){});
  }
  function cloudReplaceAll(list){
    var obj = {};
    list.forEach(function(w){ obj[w.id] = w; });
    fetch(FIREBASE_URL + ".json", {
      method: "PUT",
      body: JSON.stringify(obj)
    }).catch(function(){});
  }
  function applyRemoteSnapshot(path, data){
    if (path === "/"){
      wines = data ? Object.keys(data).map(function(k){ return data[k]; }) : [];
    } else {
      var id = path.replace(/^\//, "").split("/")[0];
      if (data === null){
        wines = wines.filter(function(w){ return w.id !== id; });
      } else {
        var idx = wines.findIndex(function(w){ return w.id === id; });
        if (idx > -1) wines[idx] = data; else wines.push(data);
      }
    }
    saveWines();
    renderAll();
  }
  function startCloudSync(){
    fetch(FIREBASE_URL + ".json")
      .then(function(res){ return res.json(); })
      .then(function(data){
        wines = data ? Object.keys(data).map(function(k){ return data[k]; }) : [];
        saveWines();
        renderAll();
      })
      .catch(function(){ /* offline - keep locally cached data */ })
      .then(function(){
        try{
          var es = new EventSource(FIREBASE_URL + ".json");
          es.addEventListener("put", function(e){
            var msg = JSON.parse(e.data);
            applyRemoteSnapshot(msg.path, msg.data);
          });
          es.addEventListener("patch", function(e){
            var msg = JSON.parse(e.data);
            applyRemoteSnapshot(msg.path, msg.data);
          });
        }catch(e){ /* EventSource not available - local + manual refresh only */ }
      });
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function typeBadgeClass(type){
    type = (type||"").toString();
    if (type.indexOf("אדום") > -1) return "red";
    if (type.indexOf("לבן") > -1) return "white";
    if (type.indexOf("רוז") > -1) return "rose";
    if (type.indexOf("מבעבע") > -1 || type.indexOf("שמפ") > -1) return "sparkling";
    return "other";
  }

  function num(v){
    var n = parseFloat(String(v).replace(/[^\d.\-]/g,""));
    return isNaN(n) ? 0 : n;
  }

  function matches(w, q){
    if (!q) return true;
    q = q.trim().toLowerCase();
    var hay = [w.name,w.winery,w.country,w.region,w.grape,w.type,w.vintage,w.cabinet,w.shelf]
      .map(function(x){return (x||"").toString().toLowerCase();}).join(" | ");
    return hay.indexOf(q) > -1;
  }

  function getFilteredWines(){
    var q = document.getElementById("search").value;
    return wines.filter(function(w){
      var typeOk = currentTypeFilter === "הכל" || (w.type||"אחר") === currentTypeFilter;
      var countryOk = currentCountryFilter === "הכל" || (w.country||"לא צוין") === currentCountryFilter;
      return typeOk && countryOk && matches(w, q);
    });
  }

  function renderChipRow(containerId, values, currentVal, onPick){
    var el = document.getElementById(containerId);
    el.innerHTML = "";
    values.forEach(function(v){
      var b = document.createElement("button");
      b.className = "chip" + (v === currentVal ? " active" : "");
      b.textContent = v;
      b.onclick = function(){ onPick(v); };
      el.appendChild(b);
    });
  }

  function renderChips(){
    var types = ["הכל"];
    wines.forEach(function(w){
      var t = w.type || "אחר";
      if (types.indexOf(t) === -1) types.push(t);
    });
    renderChipRow("type-chips", types, currentTypeFilter, function(v){
      currentTypeFilter = v; renderAll();
    });

    var countries = ["הכל"];
    wines.forEach(function(w){
      var c = w.country || "לא צוין";
      if (countries.indexOf(c) === -1) countries.push(c);
    });
    renderChipRow("country-chips", countries, currentCountryFilter, function(v){
      currentCountryFilter = v; renderAll();
    });
  }

  function renderSummary(){
    var totalBottles = wines.reduce(function(s,w){ return s + num(w.quantity); }, 0);
    var groupList = getFilteredWines();
    var groupBottles = groupList.reduce(function(s,w){ return s + num(w.quantity); }, 0);
    var isFiltered = currentTypeFilter !== "הכל" || currentCountryFilter !== "הכל" || document.getElementById("search").value.trim() !== "";
    var distinctWineries = new Set(wines.map(function(w){return w.winery||"";})).size;
    var el = document.getElementById("summary-bar");
    el.innerHTML =
      '<div class="summary-card"><div class="num">'+totalBottles+'</div><div class="lbl">סה״כ בקבוקים במלאי</div></div>'+
      '<div class="summary-card"><div class="num">'+groupBottles+'</div><div class="lbl">'+(isFiltered ? "בקבוקים בבחירה" : "בקבוקים (הכל)")+'</div></div>'+
      '<div class="summary-card"><div class="num">'+distinctWineries+'</div><div class="lbl">יקבים</div></div>';
  }

  function renderList(){
    var list = getFilteredWines();
    var container = document.getElementById("list-container");
    var empty = document.getElementById("empty-state");
    if (wines.length === 0){
      container.innerHTML = "";
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    if (list.length === 0){
      container.innerHTML = '<div class="empty-state"><div>לא נמצאו תוצאות</div></div>';
      return;
    }
    sortWines(list);
    container.innerHTML = list.map(function(w){
      var badge = typeBadgeClass(w.type);
      var qty = num(w.quantity);
      return '<div class="card">' +
        '<div class="card-top">' +
          '<div><p class="card-title">'+esc(w.winery||"ללא יקב")+(w.vintage? " · "+esc(w.vintage):"")+'</p>' +
          '<div class="card-sub">'+esc(w.name||"ללא שם")+'</div></div>' +
          '<span class="badge '+badge+'">'+esc(w.type||"אחר")+'</span>' +
        '</div>' +
        '<div class="card-meta">' +
          (w.country? '<span>מדינה: <b>'+esc(w.country)+'</b></span>':'') +
          (w.region? '<span>אזור: <b>'+esc(w.region)+'</b></span>':'') +
          (w.grape? '<span>ענב: <b>'+esc(w.grape)+'</b></span>':'') +
          (w.bottleSize? '<span>גודל: <b>'+esc(w.bottleSize)+'</b></span>':'') +
          ((w.cabinet||w.shelf)? '<span>מיקום: <b>'+esc(w.cabinet||"")+(w.shelf? "/"+esc(w.shelf):"")+'</b></span>':'') +
          (w.rating? '<span>ציון: <b>'+esc(w.rating)+'</b></span>':'') +
        '</div>' +
        '<div class="card-actions">' +
          '<button class="qty-btn" onclick="wineApp.changeQty(\''+w.id+'\',-1)">−</button>' +
          '<button style="flex:none;min-width:44px;font-weight:700;">'+qty+'</button>' +
          '<button class="qty-btn" onclick="wineApp.changeQty(\''+w.id+'\',1)">+</button>' +
          '<button onclick="wineApp.editWine(\''+w.id+'\')">עריכה</button>' +
          '<button onclick="wineApp.deleteWine(\''+w.id+'\')">מחיקה</button>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function renderInsights(){
    var el = document.getElementById("insights-content");
    if (wines.length === 0){
      el.innerHTML = '<div class="empty-state"><div class="big">📊</div><div>אין נתונים להצגה עדיין</div></div>';
      return;
    }
    var totalBottles = wines.reduce(function(s,w){return s+num(w.quantity);},0);
    var byType = {};
    wines.forEach(function(w){
      var t = w.type || "אחר";
      byType[t] = (byType[t]||0) + num(w.quantity);
    });
    var byCountry = {};
    wines.forEach(function(w){
      var c = w.country || "לא צוין";
      byCountry[c] = (byCountry[c]||0) + num(w.quantity);
    });
    var byWinery = {};
    wines.forEach(function(w){
      var y = w.winery || "לא צוין";
      byWinery[y] = (byWinery[y]||0) + num(w.quantity);
    });
    var ratings = wines.map(function(w){return parseFloat(w.rating);}).filter(function(n){return !isNaN(n);});
    var avgRating = ratings.length ? (ratings.reduce(function(a,b){return a+b;},0)/ratings.length).toFixed(1) : null;

    function barsHtml(obj, max){
      var entries = Object.keys(obj).map(function(k){return [k,obj[k]];}).sort(function(a,b){return b[1]-a[1];});
      if (max) entries = entries.slice(0, max);
      var top = entries.length ? entries[0][1] : 1;
      return entries.map(function(e){
        var pct = top ? Math.round((e[1]/top)*100) : 0;
        return '<div class="bar-row"><div class="lbl">'+esc(e[0])+'</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
          '<div class="val">'+e[1]+'</div></div>';
      }).join("");
    }

    var lowStockCount = wines.filter(function(w){var q=num(w.quantity); return q>0 && q<=1;}).length;

    el.innerHTML =
      '<div class="summary-bar">' +
        '<div class="summary-card"><div class="num">'+totalBottles+'</div><div class="lbl">סה״כ בקבוקים</div></div>' +
        '<div class="summary-card"><div class="num">'+(avgRating||"—")+'</div><div class="lbl">ציון ממוצע</div></div>' +
        '<div class="summary-card"><div class="num">'+lowStockCount+'</div><div class="lbl">מלאי נמוך</div></div>' +
      '</div>' +
      '<div class="section-title">לפי סוג יין</div>' + barsHtml(byType) +
      '<div class="section-title">לפי מדינה</div>' + barsHtml(byCountry, 8) +
      '<div class="section-title">יקבים מובילים</div>' + barsHtml(byWinery, 8);
  }

  function renderLocations(){
    var el = document.getElementById("locations-content");
    if (wines.length === 0){
      el.innerHTML = '<div class="empty-state"><div class="big">🗄️</div><div>אין נתונים להצגה עדיין</div></div>';
      return;
    }
    var groups = {};
    wines.forEach(function(w){
      var cab = w.cabinet || "ללא ארון מוגדר";
      groups[cab] = groups[cab] || [];
      groups[cab].push(w);
    });
    el.innerHTML = Object.keys(groups).sort().map(function(cab){
      var items = groups[cab].slice().sort(function(a,b){return (a.shelf||"").localeCompare(b.shelf||"","he");});
      return '<div class="loc-group"><h4>ארון: '+esc(cab)+'</h4>' +
        items.map(function(w){
          return '<div class="loc-item"><span>'+esc(w.name||"")+' ('+esc(w.winery||"")+')</span>' +
            '<span>מדף '+esc(w.shelf||"—")+' · '+num(w.quantity)+' יח׳</span></div>';
        }).join("") +
      '</div>';
    }).join("");
  }

  function renderAll(){
    renderChips();
    renderSummary();
    renderList();
    renderInsights();
    renderLocations();
  }

  function showView(v){
    currentView = v;
    ["inventory","insights","locations"].forEach(function(name){
      document.getElementById("view-"+name).classList.toggle("hidden", name !== v);
    });
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.dataset.view === v);
    });
  }

  // ---- form modal ----
  var formFieldIds = ["name","winery","type","country","region","grape","vintage","bottleSize","cabinet","shelf","quantity","rating"];
  function openForm(wine){
    editingId = wine ? wine.id : null;
    document.getElementById("form-title").textContent = wine ? "עריכת בקבוק" : "בקבוק חדש";
    formFieldIds.forEach(function(k){
      var el = document.getElementById("f-"+k);
      el.value = wine ? (wine[k] || "") : (k === "quantity" ? "1" : "");
    });
    document.getElementById("modal-form").classList.remove("hidden");
  }
  function closeForm(){ document.getElementById("modal-form").classList.add("hidden"); }

  function saveForm(){
    var data = {};
    formFieldIds.forEach(function(k){ data[k] = document.getElementById("f-"+k).value.trim(); });
    if (!data.name){ data.name = "ללא שם"; }
    var savedWine = null;
    if (editingId){
      var idx = wines.findIndex(function(w){return w.id === editingId;});
      if (idx > -1){
        wines[idx] = Object.assign({}, wines[idx], data);
        savedWine = wines[idx];
      }
    } else {
      data.id = uid();
      wines.push(data);
      savedWine = data;
    }
    saveWines();
    if (savedWine) cloudPutWine(savedWine);
    closeForm();
    renderAll();
    toast("נשמר בהצלחה");
  }

  function editWine(id){
    var w = wines.find(function(w){return w.id === id;});
    if (w) openForm(w);
  }
  function deleteWine(id){
    if (!confirm("למחוק את הבקבוק?")) return;
    wines = wines.filter(function(w){return w.id !== id;});
    saveWines();
    cloudDeleteWine(id);
    renderAll();
  }
  function changeQty(id, delta){
    var w = wines.find(function(w){return w.id === id;});
    if (!w) return;
    var q = num(w.quantity) + delta;
    if (q < 0) q = 0;
    w.quantity = q;
    saveWines();
    cloudPutWine(w);
    renderAll();
  }

  // ---- import ----
  function guessColumn(headers, aliases){
    for (var i=0;i<headers.length;i++){
      var h = (headers[i]||"").toString().trim();
      for (var j=0;j<aliases.length;j++){
        if (h === aliases[j]) return headers[i];
      }
    }
    for (var i2=0;i2<headers.length;i2++){
      var h2 = (headers[i2]||"").toString().trim();
      for (var j2=0;j2<aliases.length;j2++){
        if (h2.indexOf(aliases[j2]) > -1) return headers[i2];
      }
    }
    return "";
  }

  function handleFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
        if (!rows.length){ toast("הקובץ ריק"); return; }
        pendingImportRows = rows;
        var headerSet = {};
        var headerList = [];
        rows.forEach(function(row){
          Object.keys(row).forEach(function(k){
            if (!headerSet[k]){ headerSet[k] = true; headerList.push(k); }
          });
        });
        pendingImportHeaders = headerList;
        openImportModal();
      }catch(err){
        toast("שגיאה בקריאת הקובץ");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function openImportModal(){
    var listEl = document.getElementById("import-map-list");
    listEl.innerHTML = FIELDS.map(function(f){
      var guess = guessColumn(pendingImportHeaders, f.aliases);
      var options = ['<option value="">— לא לייבא —</option>'].concat(
        pendingImportHeaders.map(function(h){
          return '<option value="'+esc(h)+'"'+(h===guess?" selected":"")+'>'+esc(h)+'</option>';
        })
      ).join("");
      return '<div class="import-map-row"><div class="lbl">'+f.label+'</div>' +
        '<select data-field="'+f.key+'">'+options+'</select></div>';
    }).join("");
    document.getElementById("modal-import").classList.remove("hidden");
  }
  function closeImportModal(){
    document.getElementById("modal-import").classList.add("hidden");
    document.getElementById("file-input").value = "";
  }

  function isSummaryRow(w){
    var keywords = ["סה\"כ","סה״כ","סהכ","סך הכל","total","grand total"];
    var text = [w.name,w.winery,w.country,w.type,w.region,w.grape,w.cabinet,w.shelf]
      .join(" ").toLowerCase();
    for (var i=0;i<keywords.length;i++){
      if (text.indexOf(keywords[i].toLowerCase()) > -1) return true;
    }
    // a row with a quantity/rating but no identifying wine info is almost
    // certainly a totals/summary line from the sheet, not an actual bottle
    var hasIdentity = w.name || w.winery || w.country || w.type || w.region || w.grape || w.vintage;
    if (!hasIdentity && (w.quantity || w.rating)) return true;
    return false;
  }

  function confirmImport(){
    var mapping = {};
    document.querySelectorAll("#import-map-list select").forEach(function(sel){
      mapping[sel.dataset.field] = sel.value;
    });
    var mode = document.querySelector('input[name="imode"]:checked').value;
    var scanned = pendingImportRows.length;
    var allMapped = pendingImportRows.map(function(row){
      var w = {id: uid()};
      FIELDS.forEach(function(f){
        var col = mapping[f.key];
        w[f.key] = col ? (row[col] != null ? String(row[col]).trim() : "") : "";
      });
      if (!w.quantity) w.quantity = "0";
      return w;
    });
    // keep any row that has at least one non-empty mapped value, so rows
    // missing just a name (e.g. merged cells in the sheet) aren't silently dropped -
    // but drop rows that look like a totals/summary line from the sheet
    var imported = allMapped.filter(function(w){
      var hasAny = FIELDS.some(function(f){ return w[f.key]; });
      return hasAny && !isSummaryRow(w);
    });
    var skipped = scanned - imported.length;

    if (mode === "replace"){
      wines = imported;
    } else {
      wines = wines.concat(imported);
    }
    saveWines();
    cloudReplaceAll(wines);
    closeImportModal();
    renderAll();
    toast("נסרקו "+scanned+" שורות · יובאו "+imported.length+(skipped ? " · דולגו "+skipped+" ריקות" : ""));
  }

  // ---- export ----
  var EXPORT_COLUMN_ORDER = ["country","type","winery","name","region","grape","vintage","bottleSize","cabinet","shelf","quantity","rating"];

  function exportToExcel(){
    if (!wines.length){ toast("אין נתונים לייצוא"); return; }

    var exportFields = EXPORT_COLUMN_ORDER.map(function(key){
      return FIELDS.filter(function(f){ return f.key === key; })[0];
    });

    var sorted = wines.slice().sort(function(a,b){
      var byType = String(a.type||"").localeCompare(String(b.type||""), "he");
      if (byType) return byType;
      var byCountry = String(a.country||"").localeCompare(String(b.country||""), "he");
      if (byCountry) return byCountry;
      var byWinery = String(a.winery||"").localeCompare(String(b.winery||""), "he");
      if (byWinery) return byWinery;
      return num(a.vintage) - num(b.vintage);
    });

    var rows = sorted.map(function(w){
      var r = {};
      exportFields.forEach(function(f){
        r[f.label] = (f.key === "quantity") ? num(w.quantity) : (w[f.key] || "");
      });
      return r;
    });

    var ws = XLSX.utils.json_to_sheet(rows);

    // summary row: total quantity, at the bottom of the quantity column
    var totalQty = sorted.reduce(function(sum,w){ return sum + num(w.quantity); }, 0);
    var summaryExcelRow = rows.length + 2; // header (1) + data rows + 1
    var summaryRow = exportFields.map(function(f){
      if (f.key === "name") return "סה\"כ";
      if (f.key === "quantity") return totalQty;
      return "";
    });
    XLSX.utils.sheet_add_aoa(ws, [summaryRow], {origin: "A" + summaryExcelRow});

    // center-align every cell (header, data, summary), bold header + summary
    var range = XLSX.utils.decode_range(ws["!ref"]);
    for (var R = range.s.r; R <= range.e.r; R++){
      for (var C = range.s.c; C <= range.e.c; C++){
        var addr = XLSX.utils.encode_cell({r:R, c:C});
        var cell = ws[addr];
        if (!cell) continue;
        var isHeaderOrSummary = (R === range.s.r) || (R === range.e.r);
        cell.s = {
          alignment: { horizontal: "center", vertical: "center" },
          font: isHeaderOrSummary ? { bold: true } : undefined
        };
      }
    }
    ws["!cols"] = exportFields.map(function(){ return {wch: 14}; });

    var now = new Date();
    var dd = String(now.getDate()).padStart(2,"0");
    var mm = String(now.getMonth()+1).padStart(2,"0");
    var yyyy = now.getFullYear();
    var printDate = dd + "." + mm + "." + yyyy;

    // printed page footer, date in the right-hand section
    ws["!headerFooter"] = {
      oddFooter: "&R" + printDate,
      evenFooter: "&R" + printDate,
      firstFooter: "&R" + printDate
    };

    var wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] }; // sheet displayed right-to-left
    XLSX.utils.book_append_sheet(wb, ws, "מלאי יין");
    XLSX.writeFile(wb, "Wine Cellar - " + printDate + ".xlsx");
  }

  function resetAll(){
    if (!confirm("פעולה זו תמחק את כל המלאי השמור באפליקציה. להמשיך?")) return;
    wines = [];
    saveWines();
    cloudReplaceAll(wines);
    renderAll();
    document.getElementById("modal-menu").classList.add("hidden");
    toast("המלאי אופס");
  }

  // ---- wire up events ----
  document.addEventListener("DOMContentLoaded", function(){
    wines = loadWines();
    renderAll();
    startCloudSync();

    document.getElementById("search").addEventListener("input", function(){
      renderSummary();
      renderList();
    });

    document.getElementById("sort-field").value = currentSort.field;
    document.getElementById("sort-field").addEventListener("change", function(e){
      currentSort.field = e.target.value;
      renderList();
    });
    document.getElementById("sort-dir").addEventListener("click", function(){
      currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
      document.getElementById("sort-dir").textContent = currentSort.dir === "asc" ? "↑" : "↓";
      renderList();
    });

    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.addEventListener("click", function(){ showView(b.dataset.view); });
    });

    document.getElementById("add-btn").addEventListener("click", function(){ openForm(null); });
    document.getElementById("form-cancel").addEventListener("click", closeForm);
    document.getElementById("form-save").addEventListener("click", saveForm);

    document.getElementById("menu-btn").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.remove("hidden");
    });
    document.getElementById("menu-close").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.add("hidden");
    });
    document.getElementById("menu-import").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.add("hidden");
      document.getElementById("file-input").click();
    });
    document.getElementById("menu-export").addEventListener("click", function(){
      document.getElementById("modal-menu").classList.add("hidden");
      exportToExcel();
    });
    document.getElementById("menu-reset").addEventListener("click", resetAll);

    document.getElementById("file-input").addEventListener("change", function(e){
      if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
    });
    document.getElementById("import-cancel").addEventListener("click", closeImportModal);
    document.getElementById("import-confirm").addEventListener("click", confirmImport);
  });

  window.wineApp = {
    editWine: editWine,
    deleteWine: deleteWine,
    changeQty: changeQty
  };
})();
</script>
</body>
